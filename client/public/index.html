<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle">🌙</button>

    <div class="header">
        <h1><span class="gemini">Gemini</span> Chat Assistant</h1>
    </div>

    <div class="container">
        <div class="chat-box" id="chat-box">
            <div class="message bot">Hello! I'm your Gemini AI assistant. How can I help you today?</div>
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
            <!-- Microphone Button -->
            <button id="mic-button" onclick="startSpeechRecognition()">🎤</button>
        </div>

        <div class="hint">💡 Tip: Ask me anything - I can help with questions, calculations, and creative ideas!</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        function toggleTheme() {
            const isDark = htmlElement.getAttribute('data-theme') === 'dark';
            htmlElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', toggleTheme);

        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('message-input');
        const typingIndicator = document.querySelector('.typing-indicator');

        socket.on('response', (msg) => {
            typingIndicator.style.display = 'none';
            addMessage(msg, 'bot');
        });

        socket.on('status', (msg) => {
            addMessage(`⚙️ ${msg}`, 'status');
        });

        socket.on('error', (msg) => {
            addMessage(`❌ ${msg}`, 'error');
        });

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatBox.insertBefore(div, typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const msg = input.value.trim();
            if (msg) {
                addMessage(msg, 'user');
                socket.emit('message', msg);
                input.value = '';
                typingIndicator.style.display = 'flex';
            }
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Speech Recognition
        let recognition;
        let isRecording = false;

        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                alert('Your browser does not support speech recognition.');
                return;
            }

            recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('mic-button').textContent = '⏹️'; // Stop recording icon
            };

            recognition.onend = () => {
                isRecording = false;
                document.getElementById('mic-button').textContent = '🎤'; // Mic icon
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                alert('Speech recognition error: ' + event.error);
            };

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
    </script>
</body>
</html>
